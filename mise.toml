[tools]
go = "1.26.2"
node = "latest"
python = "3.12"
uv = "latest"
docker-cli = "system"

[tasks.test]
run = "go test ./..."

[tasks.setup]
description = "Create .venv and install the Python dependencies"
run = "test -x .venv/bin/python || uv venv .venv; uv pip install --quiet --python .venv/bin/python -r requirements.txt"

[tasks.pytest]
depends = ["setup"]
run = ".venv/bin/pytest"

[tasks.fix]
run = "go fix ./..."

[tasks.format]
run = "gofmt -w ."

[tasks.lint]
depends = ["lint:design"]

[tasks."lint:design"]
run = "if [ -f .puria/design/DESIGN.md ]; then npx --yes @google/design.md lint .puria/design/DESIGN.md; fi"

[tasks.run]
run = "go run ."

[tasks.serve]
depends = ["setup"]
run = ".venv/bin/uvicorn app:app --reload"

[tasks."docker:build"]
run = "docker build -t capture-status-list ."

[tasks."docker:run"]
run = "docker run --rm -p 8000:8000 -v capture-status-list-keys:/app/keys capture-status-list"

[tasks.seed]
depends = ["setup"]
run = ".venv/bin/python seed.py"

[tasks.build]
run = "go build -o bin/starter ."
